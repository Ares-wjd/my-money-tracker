name: Android CI

on:
  push:
    branches: [ "**" ]
    # 웹·문서만 바뀌었을 때는 앱을 다시 빌드하지 않는다 (폰에 불필요한 업데이트 알림 방지).
    paths-ignore: [ "web/**", "docs/**", "**.md", "firestore.rules", ".github/workflows/web.yml" ]
  pull_request:
    paths-ignore: [ "web/**", "docs/**", "**.md", "firestore.rules", ".github/workflows/web.yml" ]
  # GitHub Actions 화면에서 "Run workflow" 로 직접 다시 빌드할 수 있게 한다.
  workflow_dispatch:

# 빌드가 동시에 돌면서 dev-latest 릴리스를 서로 지우고 만들지 않도록 한 번에 하나씩 실행한다.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Secret GOOGLE_SERVICES_JSON: Firebase 콘솔에서 받은 google-services.json 파일 내용
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # Secret SIGNING_KEYSTORE_BASE64 / SIGNING_KEYSTORE_PASSWORD: 고정 서명 키 (base64) 와 비밀번호
      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 서명 키와 Firebase 설정이 모두 있을 때만, 폰에서 바로 받을 수 있게 "dev-latest" 릴리스로 올린다.
      - name: Publish to dev-latest release
        if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_PATH != '' && hashFiles('app/google-services.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk my-money-tracker.apk
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest my-money-tracker.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "개발 버전 (빌드 #$GITHUB_RUN_NUMBER)" \
            --notes "versionCode: $GITHUB_RUN_NUMBER
          브랜치: $GITHUB_REF_NAME
          커밋: $GITHUB_SHA

          폰에서 my-money-tracker.apk 를 눌러 설치하세요."
